name: Test
# Self-test: runs this repo's action for real against a live site, one job
# per mode so each produces its own clean summary. The free report job
# always runs (and exercises the PR comment on pull requests); the gate job
# runs when the MOTIONSCORE_TOKEN repository secret is set.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  HAS_TOKEN: ${{ secrets.MOTIONSCORE_TOKEN != '' }}

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Report-only audit (free path)
        id: audit
        uses: ./
        with:
          url: https://motion.dev
          pages: |
            /

      - name: Assert outputs
        env:
          GRADE: ${{ steps.audit.outputs.grade }}
          PASS: ${{ steps.audit.outputs.pass }}
        run: |
          echo "grade=$GRADE pass=$PASS"
          [[ "$GRADE" =~ ^[SABCDF]$ ]] || { echo "unexpected grade output"; exit 1; }
          [ "$PASS" = "true" ] || { echo "expected pass=true on a report-only run"; exit 1; }

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Threshold gate (paid path)
        if: env.HAS_TOKEN == 'true'
        uses: ./
        with:
          url: https://motion.dev
          threshold: F
          token: ${{ secrets.MOTIONSCORE_TOKEN }}
          comment: "false"
